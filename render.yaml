services:
  - type: web
    name: vakeel-ai-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEPLOY_MODE
        value: CLOUD
      # Render's free 512MB instance cannot hold torch plus the embedder;
      # the primary host is the Hugging Face Space (see HOSTING.md).
      - key: ENABLE_VECTOR_RETRIEVAL
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: TRUSTED_PROXY_HOPS
        sync: false
